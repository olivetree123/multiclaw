  qdrant:
    image: qdrant/qdrant:v1.17
    container_name: multiclaw-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - ${QDRANT_STORAGE_PATH:?QDRANT_STORAGE_PATH is required}:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:?QDRANT_LOG_LEVEL is required}
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}

  postgres:
    image: postgres:18-bookworm
    container_name: multiclaw-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - ${POSTGRES_STORAGE_PATH:?POSTGRES_STORAGE_PATH is required}:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:?POSTGRES_DB is required}"]
      interval: 5s
      timeout: 5s
      retries: 10
